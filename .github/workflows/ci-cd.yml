name: Continuous integration and delivery

on:
  push:
    branches: ["main", "updates"]
    paths:
      - "src/**"
  pull_request:
    branches: ["main", "updates"]
  workflow_dispatch:
    inputs:
      publish_packages:
        description: "Publish Packages?"
        default: false
        required: false
        type: boolean
      create_sync_pr:
        description: "Create sync pull request?"
        default: false
        required: false
        type: boolean

env:
  configuration: release
  packagePath: ${{ github.workspace }}/packed-nuget

jobs:
  build:
    name: Build
    # runs-on: ubuntu-latest
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src
    env:
      coverageReportPath: ${{ github.workspace }}/coverage-reports/
    outputs:
      package_version: ${{ steps.getversion.outputs.package_version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.x
            8.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build solution
        run: dotnet build --no-restore -c $env:configuration
      - name: Run unit tests
        run: dotnet test --no-build -c $env:configuration --collect:"XPlat Code Coverage;Format=cobertura" --filter "FullyQualifiedName~Tests" --results-directory ${{ env.coverageReportPath }} -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Exclude="[*]Blazing.Mvvm.Sample*"
      # - name: Codecov
      #   uses: codecov/codecov-action@v4
      #   with:
      #     directory: ${{ env.coverageReportPath }}
      #     files: ${{ env.mergedCoverageReportFileName }}
      #     token: ${{ secrets.CODECOV_TOKEN }}
      # - name: Get version
      #   id: getversion
      #   run: |
      #     nugetVersion=${{ env.GitBuildVersionSimple }}

      #     if ${{ github.ref_name == 'updates' }};
      #     then
      #       nugetVersion+="-beta"
      #     fi

      #     echo "package_version=$nugetVersion" >> $GITHUB_OUTPUT
      - name: Create nuget packages
        if: ${{ inputs.publish_packages == true }}
        run: dotnet pack --no-build -o $packagePath -c $configuration
      - name: Upload artifacts
        if: ${{ inputs.publish_packages == true }}
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: ${{ env.packagePath }}
          retention-days: 7

